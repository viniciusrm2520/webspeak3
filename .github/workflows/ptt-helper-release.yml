name: Release ptt-helper

# Builds the global push-to-talk helper for Windows, Linux and macOS and
# attaches the archives to a GitHub release. Push a tag to publish:
#   git tag ptt-helper-v0.1.0 && git push origin ptt-helper-v0.1.0
on:
  push:
    tags: ["ptt-helper-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: ptt-helper-windows-x64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: ptt-helper-linux-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: ptt-helper-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: ptt-helper-macos-x64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ptt-helper
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rdev's Linux backend reads input through X11's RECORD extension.
      - name: Install X11 headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxi-dev

      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/ptt-helper.exe, README.md, allowed-origins.txt dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.asset }}

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ptt-helper README.md allowed-origins.txt dist/
          tar -czf ${{ matrix.asset }} -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ptt-helper/${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/ptt-helper-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: ptt-helper ${{ github.ref_name }}
          # Kept out of "latest" so a future WebSpeak3 release isn't shadowed.
          make_latest: false
          files: assets/*
          body: |
            Global push-to-talk key for the WebSpeak3 web client. It watches one key
            system-wide, so push-to-talk keeps working while a game or another program
            is in front.

            **Windows:** download `ptt-helper-windows-x64.zip`, unzip and run
            `ptt-helper.exe`. SmartScreen may warn because the file isn't signed
            (More info -> Run anyway).
            **Linux:** `ptt-helper-linux-x64.tar.gz` (needs an X11 session).
            **macOS:** pick arm64 (Apple Silicon) or x64 (Intel). Allow it under
            Privacy & Security -> Accessibility; if macOS blocks it as unsigned, run
            `xattr -d com.apple.quarantine ptt-helper` once.

            Then in WebSpeak3: Options -> Hotkeys -> enable push-to-talk -> tick
            "Global key via ptt-helper". Sites allowed to connect are listed in
            `allowed-origins.txt` next to the program. See README.md for details.
